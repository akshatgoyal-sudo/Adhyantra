services:
  - type: web
    name: adhyantra-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health/live
    maxShutdownDelaySeconds: 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: APP_ENV
        value: production
      - key: MEDIA_RENDER_WORKER_MODE
        value: embedded
      - key: MEDIA_STORAGE_BACKEND
        value: supabase
      - key: MEDIA_RENDER_OUTPUT_DIR
        value: /tmp/adhyantra-media
      - key: MEDIA_STORAGE_REQUEST_TIMEOUT_SECONDS
        value: "15"
      - key: MEDIA_STORAGE_MAX_OBJECT_BYTES
        value: "49000000"
      - key: MEDIA_SIGNED_URL_TTL_SECONDS
        value: "300"
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "1"
      - key: DB_POOL_TIMEOUT_SECONDS
        value: "15"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "300"
      - key: DB_POOL_PRE_PING
        value: "true"
      - key: SECURE_SESSION_COOKIES
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: none
      - key: EMAIL_DELIVERY_MODE
        value: email
      - key: EMAIL_TRANSPORT
        value: resend
      - key: TTS_PROVIDER
        value: openai
      - key: AI_PROVIDER
        value: gemini
      - key: AI_PROVIDER_CHAIN
        value: gemini,groq,mock
      - key: EXAM_GURU_DB_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: TRUSTED_HOSTS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_MEDIA_BUCKET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: TTS_OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
